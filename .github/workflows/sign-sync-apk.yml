name: Firma PasswordSafe Sync APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PasswordSafe-Sync-Android.apk'
      - '.github/workflows/sign-sync-apk.yml'

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/PasswordSafe-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: passwordsafe
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trova Android Build Tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          echo "dir=$BUILD_TOOLS_DIR" >> "$GITHUB_OUTPUT"

      - name: Verifica APK Sync
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${{ steps.tools.outputs.dir }}/aapt"
          BADGING="$($AAPT dump badging PasswordSafe-Sync-Android.apk | head -n 1)"
          echo "$BADGING"
          PACKAGE="$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$PACKAGE" = "it.paolo.passwordsafe" || { echo "ERRORE: package $PACKAGE diverso da it.paolo.passwordsafe"; exit 1; }
          test -n "$VERSION_CODE" || { echo "ERRORE: versionCode non leggibile"; exit 1; }
          if [ "$VERSION_CODE" -lt 50 ]; then
            echo "ERRORE: versionCode $VERSION_CODE inferiore alla versione installata (50)."
            exit 1
          fi
          echo "APK Sync compatibile: package=$PACKAGE versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Prepara firma permanente
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Allinea e firma APK Sync
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${{ steps.tools.outputs.dir }}"
          "$TOOLS/zipalign" -f -p 4 PasswordSafe-Sync-Android.apk PasswordSafe-Sync-aligned.apk
          "$TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out PasswordSafe-Sync-firmata.apk \
            PasswordSafe-Sync-aligned.apk

      - name: Verifica firma finale
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${{ steps.tools.outputs.dir }}"
          "$TOOLS/apksigner" verify --verbose --print-certs PasswordSafe-Sync-firmata.apk
          "$TOOLS/aapt" dump badging PasswordSafe-Sync-firmata.apk | head -n 1

      - name: Pubblica PasswordSafe Sync firmata
        uses: actions/upload-artifact@v4
        with:
          name: PasswordSafe-Sync-firmata
          path: PasswordSafe-Sync-firmata.apk
          retention-days: 30
