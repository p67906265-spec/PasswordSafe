name: Compila APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila APK debug
        run: gradle assembleDebug --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PasswordSafe-v0.1.apk

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: PasswordSafe-v0.1-apk
          path: PasswordSafe-v0.1.apk
          retention-days: 30
