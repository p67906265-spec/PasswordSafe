name: Compila APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/PasswordSafe-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: passwordsafe
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepara firma permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > PasswordSafe-release.jks

      - name: Compila APK release
        run: gradle assembleRelease --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk PasswordSafe-v0.28.apk

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: PasswordSafe-v0.28-apk
          path: PasswordSafe-v0.28.apk
          retention-days: 30
